aid: proptrack
name: PropTrack
description: >-
  PropTrack is an Australian property data, analytics, and automated valuation
  business, part of REA Group. It supplies residential property data, an
  industry-leading AI-powered Automated Valuation Model (AVM), the PropTrack
  Home Price Index, and market insights drawn from more than a trillion property
  data points across some twelve million Australian residential properties.
  Its raw data is sourced from public records (State/Territory land titles
  offices, Valuers General, and Geoscape Australia) and proprietary sources
  including the realestate.com.au listing portal. PropTrack exposes this through
  a developer program of REST APIs — covering address suggestion and matching,
  property and listing data, sold-transaction search (including point-and-radius
  queries), automated valuations, and market metrics — documented on a hosted
  Stoplight developer portal and secured with OAuth 2.0. The APIs are aimed at
  banks, lenders, brokers, proptech platforms, and other enterprise customers
  integrating Australian property intelligence.
